services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ariv_user
      POSTGRES_PASSWORD: ariv_pass
      POSTGRES_DB: ariv_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ariv_user -d ariv_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      DATABASE_URL: postgresql+asyncpg://ariv_user:ariv_pass@db:5432/ariv_db
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test_internal_key}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - .:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_healthy
    environment:
      API_BASE: http://web:8000
      ACCOUNT_ID: ${ACCOUNT_ID:-acc_demo_123}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-${HMAC_KEY:-test_internal_key}}
      DEMO_MODE: ${DEMO_MODE:-true}
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}

volumes:
  postgres_data:
  qdrant_data:
